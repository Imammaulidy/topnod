<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WD XLM Local - VSPhone</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .log-console {
            background: #0f172a; color: #34d399; font-family: monospace;
            padding: 15px; border-radius: 8px; border: 1px solid #1e293b;
            height: 300px; overflow-y: auto; font-size: 0.85rem;
            margin-top: 20px; white-space: pre-wrap;
        }
        .section-box {
            background: rgba(0,0,0,0.4); border: 1px solid #ec4899;
            border-radius: 10px; padding: 20px; margin-bottom: 20px;
        }
        h2, h3 { color: #ec4899; margin-top: 0; }
        .row { display: flex; gap: 15px; flex-wrap: wrap; }
        .row .input-group { flex: 1; min-width: 250px; }
    </style>
</head>
<body>
    <div class="container">
        <header style="text-align: center; margin-bottom: 30px;">
            <h1 style="color: #ec4899;">WD XLM (Lokal / Fisik)</h1>
            <p style="color: #94a3b8;">Standalone Wireless ADB Terminal</p>
        </header>

        <div class="section-box">
            <h3>1. Wireless ADB Pairing (Android 11+)</h3>
            <div class="row">
                <div class="input-group">
                    <label>IP & Port (Pairing)</label>
                    <input type="text" id="pair-ip" placeholder="192.168.1.5:43210" style="background: rgba(0,0,0,0.3); border: 1px solid #ec4899; color: white; padding: 10px; border-radius: 5px; width: 100%; box-sizing: border-box;">
                </div>
                <div class="input-group">
                    <label>Pairing Code</label>
                    <input type="text" id="pair-code" placeholder="123456" style="background: rgba(0,0,0,0.3); border: 1px solid #ec4899; color: white; padding: 10px; border-radius: 5px; width: 100%; box-sizing: border-box;">
                </div>
            </div>
            <button id="btn-pair" class="run-btn" style="background-color: #8b5cf6; margin-top: 15px;">Pair Device</button>
        </div>

        <div class="section-box">
            <h3>2. Connect Device</h3>
            <div class="row">
                <div class="input-group">
                    <label>IP & Port (Connect)</label>
                    <input type="text" id="connect-ip" placeholder="192.168.1.5:5555" style="background: rgba(0,0,0,0.3); border: 1px solid #10b981; color: white; padding: 10px; border-radius: 5px; width: 100%; box-sizing: border-box;">
                </div>
            </div>
            <button id="btn-connect" class="run-btn" style="background-color: #10b981; margin-top: 15px;">Connect Device</button>
        </div>

        <div class="section-box">
            <h3>3. WD XLM Runner</h3>
            <div class="row">
                <div class="input-group">
                    <label>Alamat WD XLM</label>
                    <input type="text" id="wd-address" placeholder="GAEL2XQRRNPV2..." style="background: rgba(0,0,0,0.3); border: 1px solid #ec4899; color: white; padding: 10px; border-radius: 5px; width: 100%; box-sizing: border-box;">
                </div>
                <div class="input-group">
                    <label>Start Index (Google Auth)</label>
                    <input type="number" id="wd-index" value="1" style="background: rgba(0,0,0,0.3); border: 1px solid #ec4899; color: white; padding: 10px; border-radius: 5px; width: 100%; box-sizing: border-box;">
                </div>
            </div>
            <button id="btn-run" class="run-btn" style="background-color: #ec4899; margin-top: 15px;">Jalankan WD XLM</button>
        </div>

        <div class="section-box">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Terminal Log</h3>
                <button id="btn-clear-log" class="stop-btn" style="width: auto; padding: 5px 15px; margin: 0; background-color: rgba(239, 68, 68, 0.2);">Clear</button>
            </div>
            <div id="log-console" class="log-console">Awaiting commands...</div>
        </div>
    </div>

    <script>
        const sessionKey = Date.now().toString() + Math.floor(Math.random()*1000); // Unique session
        const logConsole = document.getElementById("log-console");
        
        function appendLog(text) {
            logConsole.textContent += "\n" + text;
            logConsole.scrollTop = logConsole.scrollHeight;
        }

        function pollLogs() {
            fetch(`/api/wd_xlm/status?session=${sessionKey}`)
            .then(res => res.json())
            .then(data => {
                if(data.logs && data.logs.length > 0) {
                    logConsole.textContent = data.logs.join("\n");
                    logConsole.scrollTop = logConsole.scrollHeight;
                }
            }).catch(console.error);
        }
        setInterval(pollLogs, 1500);

        document.getElementById("btn-pair").addEventListener("click", () => {
            const ip = document.getElementById("pair-ip").value;
            const code = document.getElementById("pair-code").value;
            if(!ip || !code) return alert("Isi IP dan Code");
            appendLog(`> Initiating pair to ${ip} with code ${code}...`);
            fetch('/api/wd_xlm/pair', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session: sessionKey, ip_port: ip, code: code})
            });
        });

        document.getElementById("btn-connect").addEventListener("click", () => {
            const ip = document.getElementById("connect-ip").value;
            if(!ip) return alert("Isi IP Connect");
            appendLog(`> Initiating connect to ${ip}...`);
            fetch('/api/wd_xlm/connect', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session: sessionKey, ip_port: ip})
            });
        });

        document.getElementById("btn-run").addEventListener("click", () => {
            const ip = document.getElementById("connect-ip").value;
            const address = document.getElementById("wd-address").value;
            const idx = document.getElementById("wd-index").value;
            if(!ip || !address || !idx) return alert("Isi IP Connect, Address, dan Index!");
            appendLog(`> Initiating WD XLM sequence...`);
            fetch('/api/wd_xlm/run', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session: sessionKey, ip_port: ip, address: address, index: idx})
            });
        });
        
        document.getElementById("btn-clear-log").addEventListener("click", () => {
            fetch(`/api/wd_xlm/clear?session=${sessionKey}`);
            logConsole.textContent = "";
        });
    </script>
</body>
</html>
